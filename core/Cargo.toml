[package]
name = "hangul-core"
version = "0.5.3"
edition = "2021"
description = "Platform-independent core of the Hangul auto-spacing input method"
publish = false

[lib]
name = "hangul_core"
crate-type = ["rlib", "staticlib"]

# Keep dependencies vendored so release/mobile builds stay offline.
[dependencies]
unicode-segmentation = { path = "vendor/unicode-segmentation-1.12.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
